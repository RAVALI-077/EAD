
<html >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Website</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand">My College</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link">Home</a></li>
        <li class="nav-item"><a class="nav-link">About</a></li>
        <li class="nav-item"><a class="nav-link">Courses</a></li>
        <li class="nav-item"><a class="nav-link">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Carousel -->
<div id="slider" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    
    <div class="carousel-item active">
      <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://via.placeholder.com/1200x400" class="d-block w-100">
    </div>

  </div>
</div>

<!-- Grid Sections -->
<div class="container mt-4">
  <div class="row text-center">

    <div class="col-md-4">
      <h4>Departments</h4>
      <p>CSE, ECE, EEE, MECH</p>
    </div>

    <div class="col-md-4">
      <h4>Facilities</h4>
      <p>Labs, Library, Sports</p>
    </div>

    <div class="col-md-4">
      <h4>Placements</h4>
      <p>Top companies recruit here</p>
    </div>

  </div>

  <!-- Button -->
  <div class="text-center mt-3">
    <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#infoModal">
      More Info
    </button>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="infoModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">College Info</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        This college provides quality education with excellent placements.
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
