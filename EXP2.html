
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
  <h2 class="text-center mb-4">Student Registration Form</h2>

  <!-- Alert -->
  <div id="successMsg" class="alert alert-success d-none">
    Form submitted successfully!
  </div>

  <form onsubmit="showAlert(); return false;">
    
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" required>
    </div>

    
    <div class="mb-3">
      <label class="form-label">Gender</label><br>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender" class="ms-3"> Female
    </div>


    <div class="mb-3">
      <label class="form-label">Department</label>
      <select class="form-select">
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
      </select>
    </div>

    
    <div class="mb-3">
      <label class="form-label">Subjects</label><br>
      <input type="checkbox"> Java
      <input type="checkbox" class="ms-3"> Python
      <input type="checkbox" class="ms-3"> DBMS
    </div>


    <div class="mb-3">
      <label class="form-label">Upload Photo</label>
      <input type="file" class="form-control">
    </div>


    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-secondary">Reset</button>

  </form>
</div>

<script>
function showAlert(){
  document.getElementById("successMsg").classList.remove("d-none");
}
</script>

</body>
</html>
